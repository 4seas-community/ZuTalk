name: macOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install just xcbeautify gitleaks
          cargo install cargo-nextest --version 0.9.100 --locked

      - name: Check source for secrets
        run: gitleaks dir . --redact --no-banner

      - name: Run static checks
        run: just ci-check

      - name: Run Rust tests
        run: |
          just local-gate-rust-core
          just local-gate-rust-macos

      - name: Run Swift tests
        run: just swift-test

      - name: Build Universal DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: just release-adhoc

      - name: Upload Universal DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zulangue-macOS-universal
          path: build/dmg/Zulangue-*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Universal DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Zulangue-macOS-universal
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(dist/Zulangue-*.dmg)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Universal DMG, found ${#packages[@]}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${packages[0]}" \
            --verify-tag \
            --title "Zulangue $GITHUB_REF_NAME" \
            --generate-notes
