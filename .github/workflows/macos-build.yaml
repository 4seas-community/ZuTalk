name: macOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install just xcbeautify gitleaks
          cargo install cargo-nextest --version 0.9.100 --locked

      - name: Check source for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Run static checks
        run: just ci-check

      - name: Run Rust tests
        run: |
          just local-gate-rust-core
          just local-gate-rust-macos

      - name: Run Swift tests
        run: just swift-test

      - name: Build Ad Hoc Universal DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          just release-adhoc
          shasum -a 256 build/dmg/Zulangue-*.dmg > build/dmg/Zulangue-macOS.sha256

      - name: Upload CI verification artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zulangue-macOS-universal-adhoc
          path: |
            build/dmg/Zulangue-*.dmg
            build/dmg/Zulangue-macOS.sha256
          if-no-files-found: error
          retention-days: 14
