[package]
name = "vt-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vt-model = { path = "../vt-model" }
vt-audio = { path = "../vt-audio" }
vt-pipeline = { path = "../vt-pipeline" }
vt-store = { path = "../vt-store" }
vt-crypto = { path = "../vt-crypto" }
vt-stt = { path = "../vt-stt" }
vt-export = { path = "../vt-export" }
vt-share = { path = "../vt-share" }
vt-i18n = { path = "../vt-i18n" }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hound = "3"
loro = "1"
uniffi = { version = "=0.31.0", default-features = false }
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
libc = "0.2"
criterion = { version = "0.5", features = ["html_reports"], optional = true }

[features]
bench = ["dep:criterion"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
hound = "3"
rusqlite = { version = "0.39", features = ["bundled"] }

[[bench]]
name = "long_session"
harness = false
required-features = ["bench"]

[lib]
crate-type = ["lib", "staticlib"]
