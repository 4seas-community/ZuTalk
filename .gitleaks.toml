[extend]
useDefault = true

[[allowlists]]
description = "Sparkle Ed25519 public verification key embedded in the app"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''SPARKLE_PUBLIC_ED_KEY = "Sm3x2TVehf4jFO1YDLPFu2xVQfnPNYGp1IeDYsLZeg8="''',
]
paths = [
  '''macos/ZuTalk/ZuTalk\.xcodeproj/project\.pbxproj$''',
]

[[allowlists]]
description = "Intentional invalid Bearer token in caption-web negative-auth smoke test"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''Authorization: Bearer wrong-token''',
]
paths = [
  '''^scripts/caption_web_prod_smoke\.sh$''',
]
