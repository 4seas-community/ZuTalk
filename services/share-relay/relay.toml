# ZuTalk 自建 iroh 中继。
#
# 放行所有设备(2026-09-29 起)。设备之间的直接同步不要账号、也没有邀请码,
# 跨网络时要靠它转发;原来那道「只放行登记过邀请码的设备」的门就拦住了它。
# 防滥用靠中继自带的限流:
#   1. 每个客户端上行 256 KiB/s,可突发 4 MiB —— 同步传的是文字,第一次全量同步
#      多半在同一网络里直连,中继只是跨网络时的后备;
#   2. 每秒接受新连接 20 个,可突发 100。
# 它**不改变隐私**。中继看不到明文,流量始终端到端加密。
#
# 取值按 iroh-relay 1.3.0 源码核对:
#   - AccessConfig 带 #[serde(rename_all = "lowercase")],所以是 access = "everyone";
#   - 限流在 [limits] 与 [limits.client.rx],bytes_per_second 不设时 max_burst_bytes
#     不生效(启动会报错);
#   - CertMode 没有 rename,取值就是字面的 "Manual" / "LetsEncrypt" / "Reloading"。
#
# 部署见 README.md,设计见 docs/architecture/local-first-sync.md 第 3 节。

# QUIC 地址发现(UDP 7824)。关掉会让打洞成功率下降。
enable_quic_addr_discovery = true

access = "everyone"

[limits]
accept_conn_limit = 20.0
accept_conn_burst = 100

[limits.client.rx]
bytes_per_second = 262144
max_burst_bytes = 4194304

[tls]
cert_mode = "LetsEncrypt"
